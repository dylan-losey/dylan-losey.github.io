<div class="social-icons">
  <div class="social-icons-right">
    {% if site.email %}
      <a class="fa" href="mailto:{{ site.email }}" aria-label="Email {{ site.author }}">{% include icons/envelope.svg %}</a>
    {% endif %}
    {% if site.youtube_id %}
      <a class="fa" href="https://youtube.com/channel/{{ site.youtube_id }}" aria-label="YouTube channel">{% include icons/youtube-play.svg %}</a>
    {% endif %}
  </div>
</div>
<div class="clearfix"></div>
